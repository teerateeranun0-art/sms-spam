<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Panel</title>
    <!-- ใช้ Inter สำหรับ UI หลัก และ JetBrains Mono สำหรับส่วนโค้ด -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #000000;
            --bg-card: #09090b;
            --bg-input: #18181b;
            --bg-console: #050505;
            
            --border-light: #27272a;
            --border-focus: #52525b;
            
            --text-primary: #ededed;
            --text-secondary: #a1a1aa;
            
            --color-blue: #3b82f6;
            --color-purple: #8b5cf6;
            --color-red: #ef4444;
            --color-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .main-card {
            width: 100%;
            max-width: 580px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        /* Header */
        .header {
            padding: 24px 24px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.1);
            color: var(--color-green);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--color-green);
            border-radius: 50%;
        }

        /* Body Section */
        .content {
            padding: 24px;
        }

        .input-group {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 480px) {
            .input-group { flex-direction: column; }
        }

        .field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .field input {
            background-color: var(--bg-input);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }

        .field input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 1px var(--border-focus);
        }

        .field input::placeholder {
            color: #52525b;
            font-family: 'Inter', sans-serif;
        }

        /* Buttons */
        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover { background: var(--bg-input); }
        .btn:active { transform: scale(0.98); }

        .btn-fast { border-color: rgba(59, 130, 246, 0.4); }
        .btn-fast:hover { background: rgba(59, 130, 246, 0.1); border-color: var(--color-blue); }

        .btn-super { border-color: rgba(139, 92, 246, 0.4); }
        .btn-super:hover { background: rgba(139, 92, 246, 0.1); border-color: var(--color-purple); }

        .btn-slow { border-color: rgba(239, 68, 68, 0.4); }
        .btn-slow:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--color-red); }

        /* Console */
        .console-wrap {
            background-color: var(--bg-console);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            overflow: hidden;
        }

        .console-header {
            display: flex;
            gap: 6px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-light);
            background: rgba(255, 255, 255, 0.02);
        }

        .mac-btn { width: 10px; height: 10px; border-radius: 50%; }
        .mac-r { background-color: #ff5f56; }
        .mac-y { background-color: #ffbd2e; }
        .mac-g { background-color: #27c93f; }

        .console-logs {
            padding: 14px;
            height: 160px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #d4d4d8;
        }

        .console-logs::-webkit-scrollbar { width: 6px; }
        .console-logs::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }

        .log-time { color: #52525b; margin-right: 8px; }
        .log-error { color: var(--color-red); }
        .log-success { color: var(--color-green); }

        /* Footer Credit */
        .footer {
            padding: 14px 24px;
            background: #050505;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .credit-link {
            color: var(--text-primary);
            font-weight: 500;
            text-decoration: none;
            margin-left: 6px;
            padding: 2px 8px;
            background: #18181b;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            transition: all 0.2s;
        }

        .credit-link:hover {
            background: #27272a;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <div>
            <h1>Dispatch Core</h1>
            <p>System Management Interface</p>
        </div>
        <div class="status-badge">
            <span class="status-dot"></span> Ready
        </div>
    </div>

    <div class="content">
        <div class="input-group">
            <div class="field">
                <label>Target Number</label>
                <input type="text" id="phone" placeholder="08XXXXXXXX" maxlength="10">
            </div>
            <div class="field">
                <label>Request Volume</label>
                <input type="number" id="count" placeholder="0">
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-fast" onclick="startSpam('fast')">Fast Mode</button>
            <button class="btn btn-super" onclick="startSpam('super')">Super Mode</button>
            <button class="btn btn-slow" onclick="startSpam('slow')">Slow Mode</button>
        </div>

        <div class="console-wrap">
            <div class="console-header">
                <div class="mac-btn mac-r"></div>
                <div class="mac-btn mac-y"></div>
                <div class="mac-btn mac-g"></div>
            </div>
            <div class="console-logs" id="log-container">System initialized. Waiting for task...</div>
        </div>
    </div>

    <div class="footer">
        Powered by <a href="https://www.tiktok.com/@tp_1092s" target="_blank" class="credit-link">@tp_1092s</a>
    </div>
</div>

<script>
    let logInterval;
    
    function getTime() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
    }

    function startSpam(mode) {
        const phone = document.getElementById('phone').value;
        const count = document.getElementById('count').value;
        const logBox = document.getElementById('log-container');
        const time = `<span class="log-time">[${getTime()}]</span>`;
        
        if (!phone || phone.length < 9) {
            logBox.innerHTML += `<br>${time}<span class="log-error">Error: Invalid phone number</span>`;
            logBox.scrollTop = logBox.scrollHeight;
            return;
        }
        if (!count) {
            logBox.innerHTML += `<br>${time}<span class="log-error">Error: Volume not specified</span>`;
            logBox.scrollTop = logBox.scrollHeight;
            return;
        }
        
        logBox.innerHTML += `<br>${time}Initializing task... (Mode: ${mode}, Target: ${phone})`;
        logBox.scrollTop = logBox.scrollHeight;
        
        fetch('/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone, count: count, mode: mode })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                if (logInterval) clearInterval(logInterval);
                logInterval = setInterval(fetchLogs, 500);
            } else {
                logBox.innerHTML += `<br>${time}<span class="log-error">Failed: ${data.message}</span>`;
                logBox.scrollTop = logBox.scrollHeight;
            }
        })
        .catch(err => {
            logBox.innerHTML += `<br>${time}<span class="log-error">Fatal: Connection timeout</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        });
    }
    
    function fetchLogs() {
        fetch('/get_logs')
        .then(response => response.json())
        .then(logs => {
            const logBox = document.getElementById('log-container');
            if(logs.length > 0) {
                let formattedLogs = logs.map(line => {
                    const time = `<span class="log-time">[${getTime()}]</span>`;
                    if(line.includes("Error") || line.includes("Failed")) return `${time}<span class="log-error">${line}</span>`;
                    if(line.includes("Success") || line.includes("Pass")) return `${time}<span class="log-success">${line}</span>`;
                    return `${time}${line}`;
                }).join('<br>');
                
                logBox.innerHTML = formattedLogs;
                logBox.scrollTop = logBox.scrollHeight;
            }
        });
    }
</script>

</body>
</html>
